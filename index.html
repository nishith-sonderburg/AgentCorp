<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentCorp 3.0</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a1020;color:#e6edf7;font:15px system-ui}main{max-width:1200px;margin:auto;padding:35px 22px}header{border-bottom:1px solid #334155;padding-bottom:20px}h1{font-size:42px;margin:7px 0}small,p{color:#9caec8}textarea{width:100%;min-height:100px;background:#172136;color:white;border:1px solid #44536e;border-radius:10px;padding:15px;font:inherit}button,select{padding:12px;border:0;border-radius:8px;background:#83e6c2;color:#102a24;font:bold 14px system-ui}button:disabled{opacity:.5}select{background:#25324c;color:white}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:20px 0}article,.panel{background:#141e31;border:1px solid #2c3a54;border-radius:12px;padding:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 system-ui}.status{color:#83e6c2}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:20px 0}.metric{font-size:25px;font-weight:bold}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:9px;text-align:left;border-bottom:1px solid #34415b;overflow-wrap:anywhere}#notice{color:#83e6c2}</style><main><header><small>ORCHESTRATION LAB / V3.0</small><h1>AgentCorp AI</h1><p>Five roles · Six stages · Adaptive free-model routing</p></header><p>Mission brief</p><textarea id="goal" maxlength="3000">Design a campus study planner.</textarea><p><select id="mode"><option value="demo">Demo — scripted</option><option value="live" disabled>Live — free model routes</option></select> <button id="run">Deploy team</button> <button id="save" disabled>Export report</button></p><p id="notice" role="status">Ready</p><div class="metrics" id="metrics"></div><section id="team"></section><div class="panel" style="overflow:auto"><h2>Execution telemetry</h2><p>Usage includes failed attempts when returned by provider. Missing usage is unknown, not zero.</p><table><thead><tr><th>Role</th><th>Model</th><th>Attempt</th><th>Budget</th><th>Latency</th><th>Tokens</th><th>Outcome</th></tr></thead><tbody id="logs"></tbody></table></div></main><script>
const $=id=>document.getElementById(id),roles=['CEO','Researcher','Developer','Marketer','QA','CEO Final'];let reports=[],attempts=[],completed=0,failed=0,elapsed=0;
function metrics(){const known=attempts.filter(x=>x.usage?.total_tokens!=null),tokens=known.reduce((s,x)=>s+x.usage.total_tokens,0),cost=attempts.filter(x=>typeof x.usage?.cost==='number').reduce((s,x)=>s+x.usage.cost,0);$('metrics').replaceChildren();for(const [k,v] of [['Stages',completed+'/6'],['Failures',failed],['Attempts',attempts.length],['Known tokens',tokens],['Missing usage',attempts.length-known.length],['Reported USD',cost.toFixed(6)],['Runtime',(elapsed/1000).toFixed(1)+'s']]){const a=document.createElement('div');a.className='panel';const l=document.createElement('small');l.textContent=k;const m=document.createElement('div');m.className='metric';m.textContent=v;a.append(l,m);$('metrics').append(a);}}
function reset(){reports=[];attempts=[];completed=failed=elapsed=0;$('logs').replaceChildren();$('team').replaceChildren();for(const role of roles){const a=document.createElement('article');a.id=role;const s=document.createElement('small');s.className='status';s.textContent='Standby';const h=document.createElement('h2');h.textContent=role;a.append(s,h,document.createElement('pre'));$('team').append(a);}metrics();}reset();
fetch('/status').then(r=>r.json()).then(s=>{$('mode').options[1].disabled=!s.live;$('notice').textContent='Server v'+s.version+' · '+(s.live?'live ready':'demo only');});
function event(x){if(x.state==='error')throw Error(x.message);if(x.state==='attempt'){attempts.push(x);const tr=document.createElement('tr');for(const v of [x.role,x.model,x.attempt,x.maxTokens,(x.latencyMs/1000).toFixed(1)+'s',x.usage?.total_tokens??'Unknown',x.outcome+(x.error?' · '+x.error:'')]){const td=document.createElement('td');td.textContent=v;tr.append(td);}$('logs').append(tr);}else if(x.role){const a=$(x.role);a.querySelector('.status').textContent=x.state+(x.latencyMs!=null?' · '+(x.latencyMs/1000).toFixed(1)+'s':'')+(x.model?' · '+x.model:'');if(x.output){a.querySelector('pre').textContent=x.output;reports.push(x);if(x.state==='done')completed++;if(x.state==='failed')failed++;}}else if(x.state==='complete'){elapsed=x.latencyMs;$('notice').textContent='Mission complete · '+x.failed+' failed stages';$('save').disabled=false;}metrics();}
$('run').onclick=async()=>{if(!$('goal').value.trim())return;reset();$('run').disabled=true;$('save').disabled=true;$('notice').textContent='Running '+$('mode').value;try{const r=await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:$('goal').value,mode:$('mode').value})});const reader=r.body.getReader(),d=new TextDecoder();let b='';while(true){const {done,value}=await reader.read();if(done)break;b+=d.decode(value,{stream:true});const lines=b.split('\n');b=lines.pop();for(const line of lines)if(line)event(JSON.parse(line));}if(b.trim())event(JSON.parse(b));}catch(e){$('notice').textContent=e.message;}finally{$('run').disabled=false;}};
$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({reports,attempts,completed,failed,elapsed},null,2)],{type:'application/json'}));a.download='agentcorp-report.json';a.click();URL.revokeObjectURL(a.href);};
</script></html>
